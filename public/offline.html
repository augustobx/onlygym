<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#080b10" />
  <title>OnlyGym · Sin conexión</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b10;color:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.card{width:min(100%,420px);border:1px solid #1e293b;background:#11151c;border-radius:24px;padding:28px;text-align:center}.mark{width:54px;height:54px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;background:#bef264;color:#080b10;font-size:24px;font-weight:900}h1{margin:0;font-size:22px}p{margin:10px 0 0;color:#94a3b8;font-size:14px;line-height:1.5}button{margin-top:22px;width:100%;height:48px;border:0;border-radius:14px;background:#bef264;color:#080b10;font-weight:800;font-size:14px;cursor:pointer}.note{margin-top:14px;font-size:11px;color:#64748b}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">OG</div>
    <h1>Estás sin conexión</h1>
    <p>OnlyGym necesita conexión para mostrar datos privados y actualizados de tu gimnasio. No guardamos tu ficha personal en la caché offline.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
    <p class="note">Cuando vuelva internet, podés continuar normalmente.</p>
  </main>
</body>
</html>
