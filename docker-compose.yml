name: onlygym-local
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: onlygym
      POSTGRES_PASSWORD: onlygym_local
      POSTGRES_DB: onlygym
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["onlygym_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlygym -d onlygym"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - onlygym_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://onlygym:onlygym_local@db:5432/onlygym?schema=public
    command: sh -c "npm ci && npx prisma generate && npm run db:deploy && npm run db:seed"
    depends_on:
      db: { condition: service_healthy }
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports: ["127.0.0.1:8025:8025"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
  web:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - onlygym_node_modules:/app/node_modules
      - onlygym_progress_photos:/app/data/progress-photos
    ports: ["127.0.0.1:3001:3000"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://onlygym:onlygym_local@db:5432/onlygym?schema=public
      BETTER_AUTH_SECRET: onlygym-local-development-secret-change-me
      BETTER_AUTH_URL: http://localhost:3001
      API_SECRET_KEY: onlygym-local-api-key
      DEFAULT_TENANT_SLUG: onlygym-demo
      TENANT_HOST_MAP: localhost=onlygym-demo,127.0.0.1=onlygym-demo
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_FROM: OnlyGym Local <no-reply@onlygym.local>
      PROGRESS_PHOTO_DIR: /app/data/progress-photos
    command: npm run dev -- --webpack
    depends_on:
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  onlygym_pgdata:
  onlygym_node_modules:
  onlygym_progress_photos:
