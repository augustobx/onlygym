version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymlink_web_prod
    restart: always
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/gymlink_v2?schema=public
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-gymlink_super_secure_production_secret_key_2026}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3005}
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: gymlink_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gymlink_v2}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data

volumes:
  pgdata_prod:
